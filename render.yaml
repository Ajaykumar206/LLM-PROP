services:
  # ============================================================================
  # LLM-Prop Unified Fullstack Service (FastAPI + React SPA)
  # Free tier friendly: Serves both the React frontend and FastAPI backend
  # ============================================================================
  - type: web
    name: llm-prop
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
